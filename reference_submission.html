<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECAPL B2B Ledger</title>
    <style>
        :root { --primary-burgundy: #800020; --clinical-blue: #002366; --accent-gold: #ffaa00; --bg-dark: #0a0a0a; --card-bg: #141414; --text-light: #f8f9fa; --border-muted: #222222; }
        body { font-family: sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; }
        .ledger-container { background: var(--card-bg); border-top: 6px solid var(--clinical-blue); border-radius: 12px; padding: 20px; max-width: 460px; width: 100%; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header-main { text-align: center; border-bottom: 1px solid var(--border-muted); padding-bottom: 12px; margin-bottom: 15px; }
        .brand-title { color: #ffffff; font-size: 1.3rem; font-weight: 800; }
        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .metric-card { background: #1e1e1e; border: 1px solid var(--border-muted); padding: 10px; border-radius: 6px; text-align: center; }
        .metric-value { font-size: 1.1rem; font-weight: bold; color: var(--accent-gold); margin-top: 4px; }
        .form-select, .form-input { width: 100%; padding: 10px; background: #1e1e1e; border: 1px solid var(--border-muted); border-radius: 6px; color: #ffffff; font-size: 0.88rem; box-sizing: border-box; margin-bottom: 10px; }
        .action-btn { background-color: var(--clinical-blue); color: white; border: none; width: 100%; padding: 12px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
        .invoice-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 15px; text-align: left; }
        .invoice-table th { color: var(--accent-gold); border-bottom: 2px solid var(--border-muted); padding: 6px; }
        .invoice-table td { border-bottom: 1px solid var(--border-muted); padding: 8px; color: #ddd; }
    </style>
    <script>
        let grossSales = 0; let totalWholesaleCost = 0; let netArbitrageProfit = 0;
        function processArbitrage() {
            const select = document.getElementById('ledgerTestSelect'); if (!select.value) return;
            const ptName = document.getElementById('ledgerPtName').value.trim() || "WALK-IN REF";
            const partner = document.getElementById('partnerSelect').value;
            const selectedText = select.options[select.selectedIndex].text;
            const retailPrice = parseInt(select.value.split('|')[1]) || 1500;
            const testName = selectedText.split(' - ')[0];
            
            // Apply hardcoded 27.5% corporate wholesale arbitrage discount
            const wholesaleCost = Math.round(retailPrice * (1 - 0.275));
            const individualProfit = retailPrice - wholesaleCost;
            
            grossSales += retailPrice; totalWholesaleCost += wholesaleCost; netArbitrageProfit += individualProfit;
            updateMetrics(); appendRow(ptName, testName, partner, retailPrice, wholesaleCost, individualProfit);
            document.getElementById('ledgerPtName').value = ''; select.selectedIndex = 0;
        }
        function updateMetrics() {
            document.getElementById('grossSalesDisplay').innerText = 'D ' + grossSales.toLocaleString();
            document.getElementById('wholesaleCostDisplay').innerText = 'D ' + totalWholesaleCost.toLocaleString();
            document.getElementById('netProfitDisplay').innerText = 'D ' + netArbitrageProfit.toLocaleString();
        }
        function appendRow(pt, test, partner, retail, cost, profit) {
            const table = document.getElementById('ledgerBody');
            const row = `<tr><td>${pt}</td><td>${test}<br><small style="color:#aaa;">📍 ${partner}</small></td><td>D ${retail}</td><td>D ${cost}</td><td style="color:#00ff00; font-weight:bold;">D ${profit}</td></tr>`;
            table.innerHTML += row;
        }
    </script>
</head>
<body>
    <div class="ledger-container">
        <div class="header-main">
            <div class="brand-title">📈 Corporate B2B Billing Ledger</div>
            <div style="color: var(--accent-gold); font-size: 0.72rem; font-weight: bold; text-transform: uppercase; margin-top: 4px;">MECAPL Arbitrage Revenue Matrix</div>
        </div>
        <div class="metric-grid">
            <div class="metric-card">
                <div style="font-size:0.65rem; color:#aaa; text-transform:uppercase;">Gross Patient Fees</div>
                <div id="grossSalesDisplay" class="metric-value">D 0</div>
            </div>
            <div class="metric-card">
                <div style="font-size:0.65rem; color:#aaa; text-transform:uppercase;">Net Profit (27.5%)</div>
                <div id="netProfitDisplay" class="metric-value" style="color:#00ff00;">D 0</div>
            </div>
        </div>
        <div style="background:#111; padding:12px; border-radius:8px; border:1px solid var(--border-muted);">
            <input type="text" id="ledgerPtName" class="form-input" placeholder="Patient Name Tracking ID">
            <select id="partnerSelect" class="form-select">
                <option value="JOBOT Laboratory Corridor">JOBOT Lab Center Corridor</option>
                <option value="Westfield Clinic Hub">Westfield Reference Hub</option>
            </select>
            <select id="ledgerTestSelect" class="form-select">
                <option value="">-- Choose Dispatched Assay Panel --</option>
                <option value="Standard Baseline Check|1500">Standard Baseline Check - D 1,500</option>
                <option value="Finecare® Progesterone Assay|1200">Finecare® Progesterone - D 1,200</option>
                <option value="Finecare® Cardiac Markers Combo|3500">Finecare® Cardiac Combo - D 3,500</option>
                <option value="Serum Electrolytes Profile|1200">Serum Electrolytes Panel - D 1,200</option>
                <option value="Complete Coagulation Profile|1800">Coagulation Profile (PT/INR) - D 1,800</option>
                <option value="Liver Function Panel (LFT)|2200">Liver Function Panel (LFT) - D 2,200</option>
                <option value="Kidney Function Panel (RFT)|1800">Kidney Function Panel (RFT) - D 1,800</option>
            </select>
            <button type="button" class="action-btn" onclick="processArbitrage()">🔒 Commit Transaction Entry to Ledger</button>
        </div>
        <table class="invoice-table">
            <thead>
                <tr>
                    <th>Patient</th>
                    <th>Assay Core</th>
                    <th>Retail</th>
                    <th>Cost</th>
                    <th>Arbitrage</th>
                </tr>
            </thead>
            <tbody id="ledgerBody"></tbody>
        </table>
    </div>
</body>
</html>
