<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECAPL - B2B Reference Submission Sheet</title>
    <style>
        :root { --primary-burgundy: #800020; --clinical-navy: #002366; --accent-gold: #ffaa00; --bg-dark: #0a0a0a; --card-bg: #141414; --text-light: #f8f9fa; --border-muted: #222222; }
        body { font-family: sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; }
        .sheet-shell { background: var(--card-bg); border-top: 6px solid var(--clinical-navy); border-radius: 12px; padding: 20px; max-width: 450px; width: 100%; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .sheet-header { text-align: center; border-bottom: 1px solid var(--border-muted); padding-bottom: 12px; margin-bottom: 15px; }
        .price-box { background: #111; border-left: 3px solid var(--accent-gold); padding: 12px; border-radius: 6px; font-size: 0.82rem; line-height: 1.5; margin-bottom: 12px; }
        .action-btn { background-color: var(--primary-burgundy); color: white; border: none; width: 100%; padding: 12px; font-size: 0.88rem; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; margin-top: 5px; }
    </style>
    <script>
        function calculateB2BArbitrage() {
            const select = document.getElementById('assaySelect'); if(!select.value) return;
            const [name, retailPrice] = select.value.split('|');
            const retail = parseInt(retailPrice);
            const wholesaleDiscount = retail * 0.275; 
            const wholesaleCost = retail - wholesaleDiscount;
            const netMargin = retail - wholesaleCost;

            document.getElementById('displayRetail').innerText = retail.toLocaleString() + '.00 GMD';
            document.getElementById('displayWholesale').innerText = wholesaleCost.toLocaleString() + '.00 GMD';
            document.getElementById('displayMargin').innerText = netMargin.toLocaleString() + '.00 GMD';
            document.getElementById('resultBlock').style.display = 'block';
        }
    </script>
</head>
<body>
    <div class="sheet-shell">
        <div class="sheet-header">
            <h3 style="margin:0; color:#fff;">🔬 MECAPL NETWORKS</h3>
            <span style="font-size:0.7rem; color:var(--accent-gold); text-transform:uppercase; font-weight:bold;">B2B Reference Laboratory Submission Sheet</span>
        </div>

        <label style="display:block; font-size:0.7rem; color:#aaa; font-weight:bold; text-transform:uppercase; margin-bottom:5px;">Select Referred Assay Profile</label>
        <select id="assaySelect" style="width:100%; padding:10px; background:#1e1e1e; border:1px solid #333; border-radius:6px; color:#fff; font-size:0.85rem; margin-bottom:15px;" onchange="calculateB2BArbitrage()">
            <option value="">-- Choose Profile to Compute B2B Matrix --</option>
            <optgroup label="Foundational Routing Packages">
                <option value="Standard Baseline Check (FBC/RDT/RBS/Uri)|1500">Standard Baseline Check - D 1,500</option>
                <option value="Routine Laboratory Diagnostic Test Bundle|2000">Routine Lab Diagnostic Bundle - D 2,000</option>
            </optgroup>
            <optgroup label="Advanced Biochemistry & Organ Panels">
                <option value="Renal Function Test (RFT / E/U/Cr)|1500">Renal Function Test (RFT) - D 1,500</option>
                <option value="Serum Electrolytes Panel (Na/K/Cl/HCO3)|1000">Serum Electrolytes Panel - D 1,000</option>
                <option value="Liver Function Test (LFT Panel)|1800">Liver Function Test (LFT) - D 1,800</option>
                <option value="Fasting Lipid Profile (FLP)|1200">Fasting Lipid Profile (FLP) - D 1,200</option>
                <option value="Thyroid Function Test (TFT Panel)|2500">Thyroid Function Test (TFT) - D 2,500</option>
                <option value="Cardiac Markers (Troponin / CK-MB)|3500">Cardiac Markers Panel - D 3,500</option>
                <option value="Quantitative Beta-hCG Assay|1500">Quantitative Beta-hCG (Q.BHCG) - D 1,500</option>
                <option value="C-Reactive Protein (CRP Quantitative)|600">C-Reactive Protein (CRP) - D 600</option>
            </optgroup>
            <optgroup label="Hematology & Immuno-Genetics">
                <option value="Blood Grouping & Rh Factor Typing|300">Blood Group + Rh Factor - D 300</option>
                <option value="Hemoglobin Genotype Screening|800">Hemoglobin Genotype - D 800</option>
                <option value="Coagulation / Clotting Profile (PT/APTT)|1200">Clotting Profile (PT/APTT) - D 1,200</option>
            </optgroup>
            <optgroup label="Infectious Disease Serology">
                <option value="Hepatitis B Surface Antigen (HBsAg Rapid)|400">Hepatitis B Screen (HBV) - D 400</option>
                <option value="Hepatitis B Complete Multiplex Panel|2500">Complete HBV Panel - D 2,500</option>
                <option value="Hepatitis C Virus Antibodies (HCV)|500">Hepatitis C Screen (HCV) - D 500</option>
                <option value="Human Immunodeficiency Virus (HIV 1/2)|500">HIV 1/2 Screening - D 500</option>
                <option value="VDRL Syphilis Serology Screening|300">VDRL Syphilis Screening - D 300</option>
                <option value="H. pylori Serum Antigen/Antibody Combo|600">H. pylori Serum Combo Test - D 600</option>
            </optgroup>
            <optgroup label="Microbiology & Clinical Pathology">
                <option value="Urine / HVS MCS Culture & Sensitivity|1200">HVS MCS Culture - D 1,200</option>
                <option value="Routine Stool Analysis (Microscopy)|400">Routine Stool Analysis - D 400</option>
                <option value="Stool Microbiology Culture (Stool MCS)|1500">Stool MCS Culture - D 1,500</option>
                <option value="Stool H. pylori Antigen Rapid Test|800">Stool H. pylori Antigen - D 800</option>
                <option value="Qualitative Strip Pregnancy Test (Urine)|300">Urine Pregnancy Test - D 300</option>
            </optgroup>
        </select>

        <div id="resultBlock" style="display:none;">
            <div class="price-box">
                💸 <strong>Outpatient Retail Fee Collected:</strong> <span id="displayRetail" style="color:#fff;"></span><br>
                🤝 <span style="color:var(--accent-gold);"><strong>JOBOT/Westfield Wholesale Cost (27.5% Off):</strong></span> <span id="displayWholesale" style="color:#00ff00; font-weight:bold;"></span><br>
                📈 <strong style="color:#00ff00;">Net MECAPL Arbitrage Profit Margin:</strong> <span id="displayMargin" style="color:#00ff00; font-weight:bold;"></span>
            </div>
            
            <div style="font-size:0.75rem; color:#888; line-height:1.4; margin:10px 0; text-align:center;">
                SLA Confirmation: 60-Minute Turnaround Time explicitly activated upon transit node drop [INDEX].
            </div>
            <button class="action-btn" onclick="alert('⚡ B2B SUBMISSION SHEET MANIFEST ENCODED:\nSpecimen parameters locked to partner analytical queue!')">📥 Commit Manifest to Partner Desk</button>
        </div>
    </div>
</body>
</html>
