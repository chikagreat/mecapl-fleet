<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECAPL Doorstep Booking Portal</title>
    <style>
        :root { --primary-burgundy: #800020; --clinical-blue: #002366; --accent-gold: #ffaa00; --bg-dark: #0a0a0a; --card-bg: #141414; --text-light: #f8f9fa; --border-muted: #222222; }
        body { font-family: sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; }
        .booking-container { background: var(--card-bg); border-top: 6px solid var(--primary-burgundy); border-radius: 12px; padding: 20px; max-width: 460px; width: 100%; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header-main { text-align: center; border-bottom: 1px solid var(--border-muted); padding-bottom: 12px; margin-bottom: 15px; }
        .brand-title { color: #ffffff; font-size: 1.4rem; font-weight: 800; }
        .form-select, .form-input { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid var(--border-muted); border-radius: 6px; color: #ffffff; font-size: 0.88rem; box-sizing: border-box; margin-bottom: 10px; }
        .action-btn { background-color: var(--primary-burgundy); color: white; border: none; width: 100%; padding: 12px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="booking-container">
        <div class="header-main">
            <div class="brand-title">🔬 MECAPL Patient Portal</div>
            <div style="color: var(--accent-gold); font-size: 0.72rem; font-weight: bold; text-transform: uppercase; margin-top: 4px;">Secure Doorstep Clinical Logistics</div>
        </div>
        
        <input type="text" id="ptName" class="form-input" placeholder="Patient Full Name">
        <input type="text" id="ptLocation" class="form-input" placeholder="Collection Address / Coordinates">
        
        <select id="testSelect" class="form-select">
            <option value="Compulsory Baseline Check|1500">Compulsory Baseline (FBC+RDT+RBS+Uri) - D 1,500</option>
            <option value="Fever Baseline + CRP\/PCT Sepsis Combo|2500">Fever Baseline + CRP/PCT Sepsis Panel - D 2,500</option>
            <option value="Finecare® Cardiac Markers Combo|3500">Finecare® Cardiac Combo (CK-MB/cTnI) - D 3,500</option>
            <option value="Premium Liver Function Suite (LFT)|2200">Liver Function Suite (LFT) - D 2,200</option>
            <option value="Advanced Renal Monitoring Suite (RFT)|1800">Kidney Function Panel (RFT) - D 1,800</option>
            <option value="Specialized Serum Electrolytes Chamber|1200">Serum Electrolytes Panel - D 1,200</option>
        </select>
        
        <input type="text" id="waveRef" class="form-input" placeholder="Wave Transaction Reference Hash">
        
        <button type="button" class="action-btn" onclick="executeRegistrationDispatch()">🔒 Complete Registration & Dispatch Phlebotomy Node</button>
    </div>

    <script>
        function executeRegistrationDispatch() {
            const name = document.getElementById('ptName').value.trim();
            const location = document.getElementById('ptLocation').value.trim();
            const test = document.getElementById('testSelect').value;
            const wave = document.getElementById('waveRef').value.trim() || "CASH_COLLECTION";
            
            if(!name || !location || !test) { alert("Please compile all mandatory fields."); return; }
            
            const [testName, price] = test.split('|');
            const registrationId = "MEC-" + Math.floor(10000 + Math.random() * 90000);
            
            const payload = `🔬 *MECAPL HEALTHCARE: DOORSTEP REQUEST*\n-----------------------------------\n• *Registration ID:* ${registrationId}\n• *Patient:* ${name}\n• *Location:* ${location}\n• *Assay Panel:* ${testName}\n• *Total Fee:* D ${parseInt(price).toLocaleString()}\n• *Payment Reference:* ${wave}\n-----------------------------------\n✓ *Dispatch Rider Notified. Insulated Cold-Chain Module Active.*`;
            
            // Bulletproof string concatenation completely bypasses phone layout parameters clipping
            const domainBase = "https://" + "wa.me";
            const targetPhone = "/220872159724";
            const queryParam = "?text=";
            const finalizedUrl = domainBase + targetPhone + queryParam + encodeURIComponent(payload);
            
            window.open(finalizedUrl, '_blank');
            
            // Strategic Marketing Automatic Flyer Download Engine
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = 'generated/mecapl_marketing_flyer.pdf';
            downloadAnchor.download = 'MECAPL_Healthcare_Flyer.pdf';
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
        }
    </script>
</body>
</html>
